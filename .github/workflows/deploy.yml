name: daily update & deploy

on:
  schedule:
    - cron: '17 1,13 * * *'   # UTC 01:17 / 13:17 = 北京时间 09:17 / 21:17，每天两次
  workflow_dispatch:        # 允许在 Actions 页面手动触发
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    name: 每日巡检官网福利
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 巡检并自动收录
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/update-data.mjs --apply

      - name: 提交数据更新
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "welfare-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "chore: 每日巡检 $(date +%F)" && git push)

  deploy:
    name: 发布到 GitHub Pages
    needs: update
    if: ${{ always() && needs.update.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
